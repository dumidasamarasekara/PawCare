<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" style="display:block">
  <sc-if value="{{ isCross }}" hint-placeholder-val="{{ true }}">
    <path d="M12 4v16M4 12h16" stroke="{{ color }}" stroke-width="2.6" stroke-linecap="round"></path>
  </sc-if>
  <sc-if value="{{ isDrop }}" hint-placeholder-val="{{ false }}">
    <path d="M12 3c0 0-6.2 8-6.2 12.4a6.2 6.2 0 0012.4 0C18.2 11 12 3 12 3z" fill="{{ color }}"></path>
  </sc-if>
  <sc-if value="{{ isLeaf }}" hint-placeholder-val="{{ false }}">
    <path d="M20 4c-9 0-16 7-16 16 9 0 16-7 16-16z" fill="{{ color }}"></path>
    <path d="M6 18c4-4 8-8 12-12" stroke="{{ leafVeinColor }}" stroke-width="1.4" stroke-linecap="round"></path>
  </sc-if>
  <sc-if value="{{ isPaw }}" hint-placeholder-val="{{ false }}">
    <ellipse cx="12" cy="15.5" rx="6" ry="5" fill="{{ color }}"></ellipse>
    <circle cx="5.2" cy="9" r="2.3" fill="{{ color }}"></circle>
    <circle cx="10.5" cy="5.5" r="2.3" fill="{{ color }}"></circle>
    <circle cx="15.5" cy="5.5" r="2.3" fill="{{ color }}"></circle>
    <circle cx="19.8" cy="9" r="2.3" fill="{{ color }}"></circle>
  </sc-if>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;icon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;paw&quot;,&quot;options&quot;:[&quot;cross&quot;,&quot;drop&quot;,&quot;leaf&quot;,&quot;paw&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#c96f4a&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const icon = this.props.icon || 'paw';
    const color = this.props.color || '#c96f4a';
    return {
      isCross: icon === 'cross',
      isDrop: icon === 'drop',
      isLeaf: icon === 'leaf',
      isPaw: icon === 'paw',
      color,
      leafVeinColor: 'rgba(255,255,255,0.55)'
    };
  }
}
</script>
</body>
</html>
